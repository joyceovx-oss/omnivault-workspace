<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>ContextForge Vault App Icon</title>
  <desc>A minimalist lavender vault door inside a rounded square on a deep charcoal background.</desc>

  <rect width="512" height="512" rx="112" fill="#161311"/>

  <rect
    x="82" y="82"
    width="348" height="348"
    rx="48"
    stroke="#A795EF"
    stroke-width="18"
  />

  <!-- Outer vault door -->
  <g stroke="#A795EF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="119" stroke-width="20"/>
    <circle cx="256" cy="256" r="91" stroke-width="8" stroke-opacity=".62"/>

    <!-- Radial locking bars -->
    <path d="M256 174V222" stroke-width="12"/>
    <path d="M256 290V338" stroke-width="12"/>
    <path d="M174 256H222" stroke-width="12"/>
    <path d="M290 256H338" stroke-width="12"/>
  </g>

  <!-- Locking pins and central hub -->
  <g fill="#A795EF">
    <circle cx="256" cy="174" r="9"/>
    <circle cx="256" cy="338" r="9"/>
    <circle cx="174" cy="256" r="9"/>
    <circle cx="338" cy="256" r="9"/>
    <circle cx="256" cy="256" r="27"/>
  </g>

  <circle cx="256" cy="256" r="10" fill="#30234D"/>
</svg>
