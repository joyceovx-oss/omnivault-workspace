
name: Apply reviewed patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Unified diff patch to apply"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apply-reviewed-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/pr/recent-logo-secret-vault-update" ]; then
            echo "Run this on the feature branch only."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: pr/recent-logo-secret-vault-update

      - name: Apply patch
        env:
          PATCH: ${{ inputs.patch }}
        run: |
          printf '%s\n' "$PATCH" > "$RUNNER_TEMP/change.patch"
          git apply --check "$RUNNER_TEMP/change.patch"
          git apply "$RUNNER_TEMP/change.patch"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build app
        run: bun run build

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply reviewed code patch"
          git push origin HEAD:pr/recent-logo-secret-vault-update
