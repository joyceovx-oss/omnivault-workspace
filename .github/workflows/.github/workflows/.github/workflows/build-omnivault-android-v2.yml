
name: Build OmniVault Android APK v2

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch containing the OmniVault application"
        required: true
        type: string
        default: "pr/recent-logo-secret-vault-update"

permissions:
  contents: read

jobs:
  android:
    name: Build OmniVault for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Configure Android Rust library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("src-tauri/Cargo.toml")
          content = cargo.read_text()

          if "[lib]" not in content:
              content += """

          [lib]
          name = "omnivault_desktop"
          crate-type = ["staticlib", "cdylib", "rlib"]
          """
              cargo.write_text(content)

          lib = Path("src-tauri/src/lib.rs")
          lib.write_text("""
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("failed to run OmniVault application");
          }
          """)

          main = Path("src-tauri/src/main.rs")
          main.write_text("""
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          fn main() {
              omnivault_desktop::run();
          }
          """)
          PY

      - name: Initialize Android project
        run: bun run tauri android init

      - name: Build Android APK
        run: bun run tauri android build --ci --debug --apk --target aarch64

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnivault-android-arm64-debug-v2
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
