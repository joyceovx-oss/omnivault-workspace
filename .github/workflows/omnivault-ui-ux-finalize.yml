name: OmniVault UI UX Finalization

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch containing the OmniVault app"
        required: true
        default: "pr/recent-logo-secret-vault-update"
        type: string

permissions:
  contents: write

concurrency:
  group: omnivault-ui-ux-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply UI UX fixes and verify the app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the selected app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Apply the approved stitched-card tag UX fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          view_path = Path("src/components/ov/SectionView.tsx")
          source = view_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { CARD_TYPES, move, newCard, stitch, ungroup } from "@/lib/ov/cards";',
                  'import { CARD_TYPES, cardHasTag, collectCardTags, move, newCard, stitch, ungroup } from "@/lib/ov/cards";',
                  "recursive tag helper imports",
              ),
              (
                  '  const tags = [...new Set(section.cards.flatMap((c) => c.tags ?? []))].sort();',
                  '  const tags = collectCardTags(section.cards);',
                  "nested tag collection",
              ),
              (
                  '{section.cards.map((card, i) => tag !== "all" && !card.tags?.includes(tag) && card.id !== focusCard ? null : (',
                  '{section.cards.map((card, i) => tag !== "all" && !cardHasTag(card, tag) && card.id !== focusCard ? null : (',
                  "nested tag filtering",
              ),
          ]

          for old, new, label in replacements:
              if new in source:
                  print(f"Already present: {label}")
                  continue
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"STOP: expected exactly one match for {label}, found {count}."
                  )
              source = source.replace(old, new, 1)

          old_effect = '  useEffect(() => { setTitle(section.title); setDesc(section.description); setSel([]); setSelecting(false); }, [section.id]);'

          new_effect = '''  useEffect(() => {
              setTitle(section.title);
              setDesc(section.description);
              setSel([]);
              setSelecting(false);
              setTag("all");
            }, [section.id]);'''

          if new_effect not in source:
              if source.count(old_effect) != 1:
                  raise SystemExit("STOP: section-switch effect did not match.")
              source = source.replace(old_effect, new_effect, 1)

          view_path.write_text(source, encoding="utf-8")

          test_path = Path("src/test/ov-core.test.ts")
          tests = test_path.read_text(encoding="utf-8")

          old_import = 'import { cloneCard, newCard, stitch, ungroup } from "@/lib/ov/cards";'
          new_import = 'import { cardHasTag, cloneCard, collectCardTags, newCard, stitch, ungroup } from "@/lib/ov/cards";'

          if new_import not in tests:
              if tests.count(old_import) != 1:
                  raise SystemExit("STOP: test imports did not match.")
              tests = tests.replace(old_import, new_import, 1)

          test_block = '''describe("recursive card tags", () => {
            it("collects tags from stitched children without case-insensitive duplicates", () => {
              const first = { ...newCard("richtext"), tags: ["Writing", "Shared"] };
              const second = { ...checklist(), tags: ["Art", "shared"] };
              const stitched = stitch([first, second], [first.id, second.id])[0]!;
              const standalone = { ...newCard("link"), tags: ["Research"] };

              const tags = collectCardTags([stitched, standalone]);

              expect(tags).toHaveLength(4);
              expect(tags).toContain("Writing");
              expect(tags).toContain("Shared");
              expect(tags).toContain("Art");
              expect(tags).toContain("Research");
            });

            it("matches tags on stitched children case-insensitively", () => {
              const first = { ...newCard("richtext"), tags: ["Writing"] };
              const second = { ...checklist(), tags: ["Art"] };
              const stitched = stitch([first, second], [first.id, second.id])[0]!;

              expect(cardHasTag(stitched, "writing")).toBe(true);
              expect(cardHasTag(stitched, " ART ")).toBe(true);
              expect(cardHasTag(stitched, "Research")).toBe(false);
            });
          });

          '''

          if 'describe("recursive card tags", () =>' not in tests:
              anchor = 'describe("url safety", () => {'
              if tests.count(anchor) != 1:
                  raise SystemExit("STOP: test insertion point not found.")
              tests = tests.replace(anchor, test_block + anchor, 1)

          test_path.write_text(tests, encoding="utf-8")
          print("UI UX source changes and regression tests are ready.")
          PY


      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format files changed by this workflow
        run: |
          bunx prettier --write \
            src/components/ov/SectionView.tsx \
            src/test/ov-core.test.ts

      - name: Run automated tests
        run: bun run test

      - name: Lint changed files
        run: |
          bunx eslint \
            src/components/ov/SectionView.tsx \
            src/test/ov-core.test.ts

      - name: Build the web application
        run: bun run build


      - name: Commit verified UI UX changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ov/SectionView.tsx src/test/ov-core.test.ts

          if git diff --cached --quiet; then
            echo "Changes already present; validation passed."
            exit 0
          fi

          git commit -m "Fix stitched card tag filtering and section filter reset"
          git push origin "HEAD:${{ inputs.target_branch }}"

      - name: Final result
        if: success()
        run: echo "UI UX finalization completed. Tests, lint, and production build passed."
